<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal History</title>
<style>
body{margin:0;background:#0d1117;color:#e6edf3;font:14px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;padding:0 16px 40px}
a{color:#58a6ff;text-decoration:none}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
td,th{padding:4px 6px;text-align:right;border-bottom:1px solid #30363d}
td:first-child,th:first-child{text-align:left}
.up{color:#3fb950}.dn{color:#f85149}
h1{font-size:18px}
</style>
</head>
<body>
<div style="font-size:12px;margin:8px 0"><a href="https://aps-source.github.io/">&#9666; Main dashboard</a> &middot; <a href="index.html">&#9666; Nifty Futures</a></div>
<h1>Strategy Signal History (today)</h1>
<table id="t"><tr><td>loading&hellip;</td></tr></table>
<script>
const fmtI=n=>(n>=0?'+':'')+Number(n).toLocaleString('en-IN');
const cls=v=>v>0?'up':(v<0?'dn':'');
fetch('data.json?t='+Date.now()).then(r=>r.json()).then(d=>{
  document.getElementById('t').innerHTML =
    '<tr><th>Time</th><th>TF</th><th>Open</th><th>Close</th><th>&Delta;px</th><th>&Delta;OI</th><th>Class</th><th>Score</th><th>Decision</th></tr>'+
    (d.signals||[]).slice().reverse().map(r=>`<tr><td>${r.time}</td><td>${r.tf_min}m</td>
    <td>${r.open}</td><td>${r.close}</td>
    <td class="${cls(+r.d_price)}">${r.d_price}</td><td class="${cls(+r.d_oi)}">${fmtI(+r.d_oi)}</td>
    <td>${r.classification}</td><td>${r.decision_score}</td><td>${r.decision}</td></tr>`).join('');
});
</script>
</body>
</html>
