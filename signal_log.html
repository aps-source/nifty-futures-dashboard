<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal History</title>
<style>
:root{color-scheme:light;--page:#eceff8;--surface:#fff;--txt:#0e1320;--mut:#76829c;--grid:#e2e7f1;--accent:#4f46e5;--good:#12a150;--bad:#dc3545}
@media (prefers-color-scheme: dark){:root{color-scheme:dark;--page:#090c14;--surface:#131a29;--txt:#eef1f9;--mut:#7f8aa3;--grid:#253048;--accent:#9b8cf3;--good:#2bc85a;--bad:#f0645f}}
body{margin:0;background:var(--page);color:var(--txt);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:0 16px 40px}
a{color:var(--accent);text-decoration:none}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px;background:var(--surface);border-radius:10px}
td,th{padding:5px 8px;text-align:right;border-bottom:1px solid var(--grid)}
td:first-child,th:first-child{text-align:left}
.up{color:var(--good)}.dn{color:var(--bad)}
h1{font-size:18px}
.note{background:var(--surface);border:1px solid var(--grid);border-radius:10px;padding:14px}
</style>
</head>
<body>
<!--main-dashboard-link--><div id="main-dashboard-link" data-mode="bar" style="box-sizing:border-box;width:100%;padding:7px 14px;background:#0f172a;font:600 12px/1.3 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;text-align:left"><a href="https://aps-source.github.io/" style="color:#e2e8f0;text-decoration:none">&#9666; Main dashboard</a></div><!--/main-dashboard-link-->

<div style="font-size:12px;margin:8px 0"><a href="index.html">&#9666; Nifty Futures</a></div>
<h1>Strategy Signal History (today)</h1>
<table id="t"><tr><td>loading&hellip;</td></tr></table>
<script>
const fmt2=n=>Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtI=n=>(n>=0?'+':'')+fmt2(n);
const fmtOI=n=>(n>=0?'+':'')+Number(n).toLocaleString('en-IN');
const cls=v=>v>0?'up':(v<0?'dn':'');
fetch('data.json?t='+Date.now()).then(r=>r.json()).then(d=>{
  document.getElementById('t').innerHTML =
    '<tr><th>Time</th><th>TF</th><th>Open</th><th>Close</th><th>&Delta;px</th><th>&Delta;OI</th><th>Class</th><th>Score</th><th>Decision</th></tr>'+
    (d.signals||[]).slice().reverse().map(r=>`<tr><td>${r.time}</td><td>${r.tf_min}m</td>
    <td>${fmt2(r.open)}</td><td>${fmt2(r.close)}</td>
    <td class="${cls(+r.d_price)}">${fmtI(+r.d_price)}</td><td class="${cls(+r.d_oi)}">${fmtOI(+r.d_oi)}</td>
    <td>${r.classification}</td><td>${r.decision_score}</td><td>${r.decision}</td></tr>`).join('');
});
</script>
</body>
</html>
